<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — CV Analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-white">
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="Home.html" class="brand">
        <span class="brand-icon">📄</span>
        <span>CV Analyzer</span>
      </a>
      <a href="Home.html" class="link-primary">&larr; Back to Home</a>
    </div>
  </header>
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-icon">&#43;</div>
      <h1 class="page-title" style="margin-bottom: 6px;">Create Account</h1>
      <p class="page-subtitle" style="margin-bottom: 24px;">Sign up to start analyzing and optimizing your CV</p>
      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="register-name">Full name</label>
          <input class="form-input" type="text" id="register-name" placeholder="Enter your full name" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="register-email">Email address</label>
          <input class="form-input" type="email" id="register-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="register-password">Password</label>
          <input class="form-input" type="password" id="register-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
      </form>
      <p style="margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); text-align: center;">
        Already have an account? <a href="login.html" class="link-primary">Sign in</a>
      </p>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
